[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["web/node_modules/*", "web/.next/*"]

[tool.black]
line-length = 88
extend-exclude = '''
(
  web/node_modules
  | web/\.next
)
'''

[tool.coverage.run]
# Python 3.14+ defaults to a different measurement engine (sysmon, based on
# sys.monitoring) than 3.12/3.13 (ctrace). Forcing ctrace everywhere keeps
# coverage measurement identical across every Python version in the CI
# matrix, so a coverage discrepancy always points to a real test/code issue
# rather than "which engine happened to run."
core = "ctrace"

[tool.pytest.ini_options]
# Pinning this section (even empty of options) makes pyproject.toml the
# pytest config file, which pins rootdir — and therefore confcutdir — to the
# repo root for every invocation, so the repo-root conftest.py sys.path
# bootstrap is always loaded no matter which tests/ directory CI passes in.

[tool.pylint.messages_control]
disable = ["duplicate-code"]

[tool.pylint.format]
# Match black/flake8/isort so C0301 can never disagree with E501.
max-line-length = 88

[tool.pylint.typecheck]
# opencv-python ships a compiled binary module astroid cannot introspect,
# which produces false E1101 no-member errors on every cv2.* attribute.
ignored-modules = ["cv2"]
generated-members = "cv2.*"