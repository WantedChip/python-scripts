[mypy]
strict = True
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
disable_error_code = import-untyped
exclude = (^|/)tests/

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
